<style>
:root{--bg:#050b1c;--card:rgba(16,34,72,.55);--line:rgba(90,150,255,.22);--tx:#e8f0ff;--mu:#7f93b8;--teal:#2de2c2;--cy:#38bdf8;--pu:#8b6cf6;--bl:#3b82f6;--warn:#f5a524;--bad:#ff6b81}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 85% -5%,rgba(45,226,194,.13),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(139,108,246,.14),transparent 60%),var(--bg);min-height:100vh;background-attachment:fixed;padding-top:env(safe-area-inset-top,0px)}
#app{max-width:480px;margin:0 auto;padding:16px 14px 100px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{font-size:17px;font-weight:700;margin:20px 0 10px}
p{color:var(--mu);font-size:13px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 30px rgba(0,0,0,.25);margin-bottom:10px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.lg{height:38px;width:auto;display:block}.lgbig{width:240px;max-width:70%;height:auto;display:block;margin:28px auto 18px}
.logo{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center}
.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--bl));display:grid;place-items:center;font-style:normal;color:#04122a;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:24px;font-weight:800;margin-top:4px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.t{flex:1;min-width:0}.t b{font-size:14px;font-weight:600;display:block;overflow-wrap:anywhere}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none;background:rgba(56,189,248,.12);border:1px solid var(--line)}
a{color:inherit;text-decoration:none}
.btn{display:inline-block;border:1px solid var(--line);background:rgba(59,130,246,.18);color:var(--tx);border-radius:11px;padding:9px 13px;font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;text-align:center}
.btn.pri{background:linear-gradient(135deg,var(--teal),var(--cy));color:#04122a;border:0}
.btn.red{color:var(--bad);padding:7px 10px}
.btn.on{background:linear-gradient(135deg,var(--bl),var(--pu));border:0}
.btn:focus-visible,input:focus-visible,select:focus-visible,nav button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wide{width:100%;margin-top:14px;padding:13px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid;color:var(--teal);border-color:rgba(45,226,194,.4);background:rgba(45,226,194,.1)}
.tag.full{color:var(--bad);border-color:rgba(255,107,129,.4);background:rgba(255,107,129,.1)}
.flex{display:flex;gap:8px;align-items:center;justify-content:space-between}
.alert{border-color:rgba(245,165,36,.45);background:linear-gradient(135deg,rgba(245,165,36,.14),rgba(16,34,72,.55))}
input,select{width:100%;background:rgba(5,11,28,.6);border:1px solid var(--line);color:var(--tx);border-radius:11px;padding:12px;font:15px 'Plus Jakarta Sans',system-ui,sans-serif;margin-top:6px}
input[type=date]{color-scheme:dark}
label{font-size:12px;color:var(--mu);display:block;margin-top:12px}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(6,14,34,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}
nav div{max-width:480px;margin:0 auto;display:flex;gap:4px}
nav button{flex:1;background:none;border:0;color:var(--mu);font:600 11px 'Plus Jakarta Sans',system-ui,sans-serif;padding:7px 0;border-radius:12px;display:flex;flex-direction:column;gap:3px;align-items:center}
nav button span{font-size:19px}
nav button.on{color:var(--teal);background:rgba(45,226,194,.1)}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs .btn{flex:1}
.chat{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:10px 0}
.m{padding:8px 12px;border-radius:14px;font-size:13px;max-width:82%;background:rgba(255,255,255,.07);overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--bl),var(--pu))}
.m small{display:block;color:var(--cy);font-size:10px;font-weight:700}
.er{color:var(--bad);margin-top:8px}
.sw{text-align:center;margin-top:12px;color:var(--cy);cursor:pointer}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:linear-gradient(135deg,var(--teal),var(--cy));color:#04122a;font-weight:700;font-size:13px;padding:11px 18px;border-radius:12px;z-index:9}
</style></head><body>

const MSG={'auth/invalid-credential':'Wrong email or password.','auth/email-already-in-use':'This email already has an account. Sign in instead.','auth/weak-password':'Use a password of at least 6 characters.','auth/invalid-email':'Enter a valid email address.','auth/too-many-requests':'Too many tries. Wait a few minutes.'};
let subs=[],cs=null;
const sub=()=>Object.keys(S.D).filter(c=>S.main||!['leaderRequests','leaders'].includes(c)).forEach(c=>subs.push(onSnapshot(collection(db,c),s=>{S.D[c]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error(c,e))));
onAuthStateChanged(auth,async u=>{subs.forEach(x=>x());subs=[];S.u=u;S.L=false;S.main=false;S.req=false;S.p=null;
if(u){try{const l=await getDoc(doc(db,'leaders',u.uid));S.L=l.exists();S.main=S.L&&l.data().main===true}catch(e){}
if(!S.L)try{S.req=(await getDoc(doc(db,'leaderRequests',u.uid))).exists()}catch(e){}
let p=S.reg;if(!p){const s=await getDoc(doc(db,'users',u.uid));p=s.exists()?s.data():{name:S.L?'Leader':u.email}}
S.p=p;S.v=S.L?'up':'home';sub()}render()});

function auth_(){const L=S.role==1,up=S.mode=='up';
return `<img class="lgbig" src="${LOGO}" alt="BMore"><h1 style="text-align:center">Welcome</h1><div class="tabs"><button class="btn ${L?'':'on'}" onclick="f.role(0)">Student</button><button class="btn ${L?'on':''}" onclick="f.role(1)">Leader</button></div><div class="card"><label style="margin-top:0">Email</label><input id="em" type="email" autocapitalize="none" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="current-password">${up?`<label>Full name</label><input id="n">`:''}${up&&!L?`<label>College</label><input id="c" value="Physical Therapy"><label>Year</label><select id="y"><option>Year 1</option><option>Year 2</option><option>Year 3</option><option>Year 4</option></select><label>Academic number</label><input id="a" inputmode="numeric">`:''}<p class="er" id="er"></p>${L&&up?'<p style="margin-top:10px">Leader accounts start as normal accounts. The main leader must approve you.</p>':''}<button class="btn pri wide" style="margin-top:10px" onclick="f.go()">${up?(L?'Create account and request leader access':'Create account'):'Sign in'}</button><p class="sw" onclick="f.mode()">${up?'Have an account? Sign in':'New here? Create an account'}</p>${up?'':'<p class="sw" onclick="f.reset()">Forgot password?</p>'}</div>`}
function home(){const D=S.D,soon=D.assignments.filter(a=>{const x=days(a.due);return x>=0&&x<=1});
return `${head()}${!S.L?(S.req?'<div class="card"><b>Leader request sent</b><p>Waiting for the main leader to approve it. Log out and back in after approval.</p></div>':'<div class="card"><b>Want to help manage BMore?</b><p>Ask the main leader for leader access.</p><button class="btn wide" style="margin-top:10px" onclick="f.req()">Request leader access</button></div>'):''}<p>Good day</p><h1>${E(S.p.name.split(' ')[0])} 👋</h1>${soon.map(a=>`<div class="card alert" style="margin-top:14px"><b>⏰ Due ${days(a.due)?'tomorrow':'today'}</b><p style="color:var(--tx);margin-top:6px">${E(a.title)} · ${E(a.subject)}</p><button class="btn pri" style="margin-top:10px" onclick="f.v('proj')">Open project</button></div>`).join('')}<div class="grid" style="margin-top:14px"><div class="card stat"><p>Assignments</p><b>${D.assignments.length}</b></div><div class="card stat"><p>My groups</p><b>${D.groups.filter(g=>g.members.includes(S.u.uid)).length}</b></div><div class="card stat"><p>Lectures</p><b>${D.lectures.length}</b></div><div class="card stat"><p>Question files</p><b>${D.questions.length}</b></div></div><h2>Quick links</h2><div class="card">${D.links.slice(0,4).map(l=>row('🔗',l.title,E(l.cat),lnk(l.url,'Open'))).join('')||'<p>No links yet.</p>'}</div>`}
function links(){const D=S.D;return `${head()}<h1>College links</h1>${CATS.map(c=>`<h2>${c}</h2><div class="card">${D.links.filter(l=>l.cat==c).map(l=>row('🔗',l.title,'',lnk(l.url,'Open')+del('links',l.id))).join('')||'<p>Nothing here yet.</p>'}</div>`).join('')}`}
function proj(){const D=S.D,L=S.L;return `${head()}<h1>Project groups</h1><p style="margin-top:6px">Create or join a group. No group? Match with others who have none.</p><h2>Assignments</h2>${[...D.assignments].sort((a,b)=>a.due>b.due?1:-1).map(a=>{const gs=D.groups.filter(g=>g.aid==a.id),mine=myG(a.id);
return `<div class="card"><div class="flex"><b>${E(a.title)}</b><span class="tag">Team of ${a.need}</span></div><p>${E(a.subject)} · Due ${fd(a.due)}</p>${a.details?`<p style="color:var(--tx);margin-top:6px">${E(a.details)}</p>`:''}<div style="margin-top:8px">${gs.map(g=>{const n=g.members.length,full=n>=g.size,m=g.members.includes(S.u.uid);return row('👥',g.name,`${n} of ${g.size} members`,(full?'<span class="tag full">Full</span>':'')+(m||L?`<button class="btn pri" onclick="f.open('${g.id}')">Chat</button>`:!mine&&!full?`<button class="btn" onclick="f.join('${g.id}')">Join</button>`:'')+del('groups',g.id))}).join('')}</div>${!mine&&!L?`<div class="flex" style="margin-top:10px"><button class="btn" style="flex:1" onclick="f.mk('${a.id}')">Create group</button><button class="btn pri" style="flex:1" onclick="f.auto('${a.id}')">Match me</button></div>`:''}</div>`}).join('')||'<div class="card"><p>No assignments yet.</p></div>'}`}
function chat(){const g=S.D.groups.find(x=>x.id==S.chat);if(!g)return `<button class="btn" onclick="f.back()">‹ Back</button>`;
return `<button class="btn" onclick="f.back()">‹ Back</button><h2 style="margin-top:14px">${E(g.name)}</h2><p>${Object.values(g.names||{}).map(E).join(', ')}</p><div class="card"><div class="chat">${S.M.map(m=>`<div class="m ${m.uid==S.u.uid?'me':''}">${m.uid==S.u.uid?'':`<small>${E(m.name)}</small>`}${E(m.text)}</div>`).join('')||'<p>No messages yet. Say hi 👋</p>'}</div><div class="flex"><input id="cm" placeholder="Message your group" style="margin:0" onkeydown="if(event.key=='Enter')f.send()"><button class="btn pri" onclick="f.send()">Send</button></div></div>`}
function files(){const D=S.D,t=S.ft;return `${head()}<h1>Study files</h1><div class="tabs"><button class="btn ${t?'':'on'}" onclick="f.ft(0)">Lectures</button><button class="btn ${t?'on':''}" onclick="f.ft(1)">Questions</button></div>${t?`<div class="card">${D.questions.map(q=>row('📝',q.title,E(q.subject),lnk(q.url,'Download')+del('questions',q.id))).join('')||'<p>No question files yet.</p>'}</div>`:(grp(D.lectures,'subject').map(s=>`<div class="card"><b>${E(s)}</b>${D.lectures.filter(l=>l.subject==s).map(l=>row('📄',l.title,l.rec?`<span style="color:var(--teal)">${l.kind=='audio'?'🎧 Audio record':'🎥 Video record'}</span>`:'Record: Unavailable',lnk(l.file,'Open')+(l.rec?lnk(l.rec,'▶'):'')+del('lectures',l.id))).join('')}</div>`).join('')||'<div class="card"><p>No lectures yet.</p></div>')}`}
function up(){const t=S.lt,fm=(a,b)=>`<div class="card">${a}<button class="btn pri wide" onclick="f.add(${t})">${b}</button></div>`,inp=(i,l,p,ty)=>`<label>${l}</label><input id="${i}" ${ty?`type="${ty}"`:''} placeholder="${p||''}">`,D=S.D;let b;
if(t==0)b=fm(inp('a1','Assignment title','Gait analysis report')+inp('a2','Subject','Biomechanics')+inp('a3','Deadline','','date')+inp('a4','Team size','4','number')+inp('a5','Details (optional)',''),'Publish assignment')+`<h2>Published</h2><div class="card">${D.assignments.map(a=>row('📌',a.title,`${E(a.subject)} · Due ${fd(a.due)} · Team of ${a.need}`,del('assignments',a.id))).join('')||'<p>Nothing yet.</p>'}</div>`;
else if(t==1)b=fm(inp('a1','Subject','Anatomy')+inp('a2','Lecture title','L4 – Knee joint')+inp('a3','Lecture file link','Drive or Telegram link','url')+inp('a4','Record link (optional)','Leave empty if no record','url')+`<label>Record type</label><select id="a5"><option value="video">Video</option><option value="audio">Audio</option></select>`,'Add lecture')+`<h2>Published</h2><div class="card">${D.lectures.map(l=>row('📄',l.title,E(l.subject)+' · '+(l.rec?'Record attached':'Record: Unavailable'),del('lectures',l.id))).join('')||'<p>Nothing yet.</p>'}</div>`;
else if(t==2)b=fm(inp('a1','Subject','Physiology')+inp('a2','File name','Midterm bank')+inp('a3','File link','Drive or Telegram link','url'),'Add questions file')+`<h2>Published</h2><div class="card">${D.questions.map(q=>row('📝',q.title,E(q.subject),del('questions',q.id))).join('')||'<p>Nothing yet.</p>'}</div>`;
else if(t==4&&S.main)b=lead();else b=fm(`<label>Category</label><select id="a1">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>`+inp('a2','Title','Year 2 main group')+inp('a3','Link','https://','url'),'Add link')+`<h2>Published</h2><div class="card">${D.links.map(l=>row('🔗',l.title,E(l.cat),del('links',l.id))).join('')||'<p>Nothing yet.</p>'}</div>`;
return `${head()}<h1>Upload center</h1><p style="margin-top:6px">What you add here shows up for every student.</p><div class="tabs">${['Assignments','Lectures','Questions','Links',...(S.main?['Leaders']:[])].map((x,i)=>`<button class="btn ${t==i?'on':''}" style="padding:9px 4px;font-size:12px" onclick="f.lt(${i})">${x}</button>`).join('')}</div>${b}`}
function lead(){const D=S.D;return `<h2>Leader requests (${D.leaderRequests.length})</h2><div class="card">${D.leaderRequests.map(r=>row('🙋',r.name,E(r.email),`<button class="btn pri" onclick="f.ok('${r.id}')">Accept</button><button class="btn red" onclick="f.no('${r.id}')">Reject</button>`)).join('')||'<p>No requests.</p>'}</div><h2>Leaders</h2><div class="card">${D.leaders.map(l=>row('🛡️',l.name||'Leader',E(l.email||'')+(l.main?' · Main leader':''),l.main?'':`<button class="btn red" onclick="f.rm('${l.id}')">Remove</button>`)).join('')||'<p>None.</p>'}</div>`}
function render(){const app=$('#app'),nav=$('#nav');if(!S.u){nav.hidden=true;app.innerHTML=auth_();return}
if(!S.p){nav.hidden=true;app.innerHTML='<p style="margin-top:60px;text-align:center">Loading…</p>';return}
const cm=$('#cm'),keep=cm?cm.value:null,foc=cm&&document.activeElement==cm;
app.innerHTML=S.chat?chat():({home,links,proj,files,up})[S.v]();
const T=S.L?[['up','🛠️','Upload'],['proj','👥','Projects'],['links','🔗','Links'],['files','📚','Files']]:[['home','🏠','Home'],['links','🔗','Links'],['proj','👥','Projects'],['files','📚','Files']];
nav.hidden=false;nav.firstElementChild.innerHTML=T.map(x=>`<button class="${S.v==x[0]&&!S.chat?'on':''}" onclick="f.v('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');
if(keep!=null){const n=$('#cm');if(n){n.value=keep;if(foc)n.focus()}}
const ch=$('.chat');if(ch)ch.scrollTop=1e9}
f.role=r=>{S.role=r;render()};f.mode=()=>{S.mode=S.mode=='in'?'up':'in';render()};
f.v=v=>{f.back(true);S.v=v;render();scrollTo(0,0)};f.ft=t=>{S.ft=t;render()};f.lt=t=>{S.lt=t;render()};
f.out=()=>signOut(auth);
f.reset=async()=>{const e=val('em');if(!e)return er('Type your email first, then tap Forgot password.');try{await sendPasswordResetEmail(auth,e);er('');toast('Reset email sent')}catch(x){er(MSG[x.code]||'Could not send the email.')}};
f.go=async()=>{const e=val('em'),p=$('#pw').value,up=S.mode=='up',L=S.role==1;if(!e||p.length<6)return er('Enter your email and a password of 6 or more characters.');
try{if(up){const n=val('n');if(!n)return er('Enter your full name.');S.reg={name:n,email:e,college:L?'':val('c'),year:L?'':val('y'),acad:L?'':val('a')};const c=await createUserWithEmailAndPassword(auth,e,p);await setDoc(doc(db,'users',c.user.uid),S.reg);if(L){await setDoc(doc(db,'leaderRequests',c.user.uid),{name:n,email:e,t:serverTimestamp()});S.req=true}S.reg=null;render()}else await signInWithEmailAndPassword(auth,e,p)}catch(x){S.reg=null;er(MSG[x.code]||'Something went wrong. Try again.')}};
f.req=async()=>{try{await setDoc(doc(db,'leaderRequests',S.u.uid),{name:S.p.name,email:S.u.email,t:serverTimestamp()});S.req=true;render();toast('Request sent')}catch(x){toast('Could not send')}};
f.ok=async id=>{const r=S.D.leaderRequests.find(x=>x.id==id);try{await setDoc(doc(db,'leaders',id),{main:false,name:r.name,email:r.email});await deleteDoc(doc(db,'leaderRequests',id));toast('Leader added')}catch(x){toast('Could not accept')}};
f.no=async id=>{try{await deleteDoc(doc(db,'leaderRequests',id))}catch(x){toast('Could not reject')}};
f.rm=async id=>{if(confirm('Remove this leader?'))try{await deleteDoc(doc(db,'leaders',id))}catch(x){toast('Could not remove')}};
f.add=async t=>{const v=i=>val('a'+i),c=['assignments','lectures','questions','links'][t];let d;
if(t==0){if(!v(1)||!v(3))return toast('Add a title and deadline');d={title:v(1),subject:v(2)||'General',due:v(3),need:+v(4)||4,details:v(5)}}
else if(t==1){if(!v(1)||!v(2)||!v(3))return toast('Add subject, title and file link');d={subject:v(1),title:v(2),file:v(3),rec:v(4),kind:v(5)}}
else if(t==2){if(!v(1)||!v(2)||!v(3))return toast('Fill all fields');d={subject:v(1),title:v(2),url:v(3)}}
else{if(!v(2)||!v(3))return toast('Add a title and link');d={cat:v(1),title:v(2),url:v(3)}}
try{await addDoc(collection(db,c),{...d,t:serverTimestamp()});toast('Saved')}catch(x){toast('Could not save')}};
f.del=async(c,id)=>{if(confirm('Delete this?'))try{await deleteDoc(doc(db,c,id))}catch(x){toast('Could not delete')}};
f.mk=async id=>{const a=S.D.assignments.find(x=>x.id==id);if(myG(id))return;const n=prompt('Group name');if(!n)return;try{await addDoc(collection(db,'groups'),{aid:id,name:n.slice(0,40),size:a.need,auto:false,members:[S.u.uid],names:{[S.u.uid]:S.p.name},t:serverTimestamp()})}catch(x){toast('Could not create the group')}};
f.join=async gid=>{const r=doc(db,'groups',gid);try{await runTransaction(db,async t=>{const g=(await t.get(r)).data();if(g.members.length>=g.size)throw'full';if(g.members.includes(S.u.uid))return;t.update(r,{members:[...g.members,S.u.uid],names:{...g.names,[S.u.uid]:S.p.name}})})}catch(x){toast(x=='full'?'This group is full':'Could not join')}};
f.auto=async id=>{if(myG(id))return;const a=S.D.assignments.find(x=>x.id==id),g=S.D.groups.find(x=>x.aid==id&&x.auto&&x.members.length<x.size);if(g)return f.join(g.id);const n=S.D.groups.filter(x=>x.aid==id&&x.auto).length+1;try{await addDoc(collection(db,'groups'),{aid:id,name:'Match group '+n,size:a.need,auto:true,members:[S.u.uid],names:{[S.u.uid]:S.p.name},t:serverTimestamp()});toast('Waiting for others to match')}catch(x){toast('Could not match')}};
f.open=gid=>{S.chat=gid;S.M=[];cs&&cs();cs=onSnapshot(query(collection(db,'groups',gid,'messages'),orderBy('t')),s=>{S.M=s.docs.map(d=>d.data());render()},e=>console.error(e));render()};
f.back=q=>{cs&&cs();cs=null;S.chat=null;if(!q)render()};
f.send=async()=>{const i=$('#cm'),t=i.value.trim();if(!t)return;i.value='';try{await addDoc(collection(db,'groups',S.chat,'messages'),{uid:S.u.uid,name:S.p.name,text:t.slice(0,500),t:serverTimestamp()})}catch(x){toast('Message not sent')}};
render();
</script></body></html>
